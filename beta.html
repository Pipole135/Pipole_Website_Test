
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Beta-Portal | PIPOLE Modding</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #101116;
      --surface: #1b1d25;
      --border: #303340;
      --text: #f3f4f6;
      --muted: #a7aab6;
      --accent: #7c83ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
    }

    main {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .brand p,
    .muted {
      color: var(--muted);
      line-height: 1.6;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #111219;
      color: var(--text);
      font: inherit;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .switch {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .switch button {
      margin: 0;
      background: #303340;
    }

    .switch button[aria-pressed="true"] {
      background: var(--accent);
    }

    #message {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <header class="brand">
      <h1>PIPOLE Modding</h1>
      <p>Beta-Tester-Portal</p>
    </header>

    <section class="panel">
      <div class="switch">
        <button id="loginTab" type="button" aria-pressed="true">
          Anmelden
        </button>
        <button id="registerTab" type="button" aria-pressed="false">
          Registrieren
        </button>
      </div>

      <h2 id="formTitle">Willkommen zurück</h2>
      <p class="muted" id="formDescription">
        Melde dich mit deinem freigegebenen Beta-Konto an.
      </p>

      <form id="authForm">
        <label for="email">E-Mail-Adresse</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <div id="passwordFields">
          <label for="password">Passwort</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
            required
          >

          <div id="confirmPasswordField" hidden>
            <label for="confirmPassword">Passwort wiederholen</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
            >
          </div>
        </div>

        <button id="submitButton" type="submit">Anmelden</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    
      <div id="adminPanel" hidden>
        <hr style="margin: 24px 0; border-color: #303340;">
      
        <h2>Admin-Dashboard</h2>
        <p class="muted">Verwalte die Zugänge zu deinem Beta-Portal.</p>
      
        <h3>Wartende Tester</h3>
        <button id="refreshUsersButton" type="button">
          Liste aktualisieren
        </button>
      
        <p id="pendingUsersMessage" class="muted" role="status"></p>
        <div id="pendingUsersList"></div>
      
        <hr style="margin: 28px 0; border-color: #303340;">
      
        <h3>Aktive Tester</h3>
        <p class="muted">Verwalte bereits freigeschaltete Beta-Tester.</p>
      
        <button id="refreshApprovedButton" type="button">
          Aktive Tester aktualisieren
        </button>
      
        <p id="approvedUsersMessage" class="muted" role="status"></p>
        <div id="approvedUsersList"></div>
      </div>

    <footer>
      PIPOLE Modding · Geschützter Beta-Bereich
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  
  <script>
  const SUPABASE_URL = "https://lsoweghxhvvudznkjpch.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ks9TQt19oSe8iVlH914H-A_jk-6D4Wl";
  
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
  
  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");
  const authForm = document.getElementById("authForm");
  const formTitle = document.getElementById("formTitle");
  const formDescription = document.getElementById("formDescription");
  const submitButton = document.getElementById("submitButton");
  const confirmPasswordField = document.getElementById("confirmPasswordField");
  const confirmPassword = document.getElementById("confirmPassword");
  const password = document.getElementById("password");
  const message = document.getElementById("message");  
  const adminPanel = document.getElementById("adminPanel");
  const refreshUsersButton = document.getElementById("refreshUsersButton");
  const pendingUsersMessage = document.getElementById("pendingUsersMessage");
  const pendingUsersList = document.getElementById("pendingUsersList");
  const refreshApprovedButton = document.getElementById("refreshApprovedButton");
  const approvedUsersMessage = document.getElementById("approvedUsersMessage");
  const approvedUsersList = document.getElementById("approvedUsersList");

  
  let mode = "login";
  
  function setMessage(text, isError = false) {
    message.textContent = text;
    message.style.color = isError ? "#ff8585" : "#a7e8b0";
  }
  
  function setMode(nextMode) {
    mode = nextMode;
    const registering = mode === "register";
  
    loginTab.setAttribute("aria-pressed", String(!registering));
    registerTab.setAttribute("aria-pressed", String(registering));
  
    formTitle.textContent = registering
      ? "Beta-Zugang beantragen"
      : "Willkommen zurück";
  
    formDescription.textContent = registering
      ? "Erstelle dein Konto. Du erhältst erst nach Admin-Freigabe Zugriff."
      : "Melde dich mit deinem Beta-Konto an.";
  
    submitButton.textContent = registering ? "Konto erstellen" : "Anmelden";
    password.autocomplete = registering ? "new-password" : "current-password";
    confirmPasswordField.hidden = !registering;
    confirmPassword.required = registering;
    setMessage("");
  }
  
  loginTab.addEventListener("click", () => setMode("login"));
  registerTab.addEventListener("click", () => setMode("register"));
  
  
  authForm.addEventListener("submit", async (event) => {
    event.preventDefault();
  
    const email = document.getElementById("email").value.trim();
    const passwordValue = password.value;
  
    if (mode === "register" && passwordValue !== confirmPassword.value) {
      setMessage("Die Passwörter stimmen nicht überein.", true);
      return;
    }
  
    submitButton.disabled = true;
    setMessage(mode === "register" ? "Konto wird erstellt …" : "Anmeldung läuft …");
  
    try {
      if (mode === "register") {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password: passwordValue,
          options: {
            emailRedirectTo: "https://www.pipole.de/beta.html"
          }
        });
  
        if (error) throw error;
  
        if (data.session) {
          await supabaseClient.auth.signOut();
        }
  
        setMessage(
          "Registrierungsanfrage übermittelt. Zugriff erhältst du erst nach Freigabe."
        );
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password: passwordValue
        });
  
        if (error) throw error;
  
        const { data: checkData, error: checkError } =
          await supabaseClient.functions.invoke("beta-admin-check");
  
        if (checkError) {
          await supabaseClient.auth.signOut();
          throw new Error("Kontostatus konnte nicht geprüft werden. Bitte später erneut versuchen.");
        }
  
        if (!checkData || checkData.authenticated !== true) {
          await supabaseClient.auth.signOut();
          throw new Error("Anmeldung konnte nicht bestätigt werden.");
        }
  
        if (checkData.isApproved !== true) {
          await supabaseClient.auth.signOut();
          adminPanel.hidden = true;
          setMessage(
            "Dein Konto wartet noch auf Freigabe. Bitte versuche es später erneut."
          );
          return;
        }
  
        setMessage(
          checkData.isAdmin
            ? "Willkommen im Admin-Bereich."
            : "Anmeldung erfolgreich. Willkommen im Beta-Bereich."
        );
  
        if (checkData.isAdmin) {
          adminPanel.hidden = false;
          await loadPendingUsers();
          await loadApprovedUsers();
        } else {
          adminPanel.hidden = true;
        }
      }
    } catch (error) {
      setMessage(error.message || "Es ist ein Fehler aufgetreten.", true);
    } finally {
      submitButton.disabled = false;
    }
  });


      async function loadPendingUsers() {
      pendingUsersMessage.textContent = "Lade wartende Tester …";
      pendingUsersList.replaceChildren();
    
      const { data, error } = await supabaseClient.functions.invoke(
        "beta-admin-users",
        { body: { action: "list_pending" } }
      );
    
      if (error) {
        console.error("Fehler beim Laden der Tester:", error);
        pendingUsersMessage.textContent =
          "Die Tester-Liste konnte nicht geladen werden.";
        return;
      }
    
      const users = data?.users || [];
    
      if (users.length === 0) {
        pendingUsersMessage.textContent = "Keine wartenden Tester vorhanden.";
        return;
      }
    
      pendingUsersMessage.textContent =
        `${users.length} wartende Tester gefunden.`;
    
      users.forEach((user) => {
        const item = document.createElement("div");
        item.style.cssText =
          "display:flex;gap:12px;align-items:center;justify-content:space-between;" +
          "flex-wrap:wrap;padding:12px;margin:10px 0;border:1px solid #303340;border-radius:8px;";
    
        const info = document.createElement("div");
        info.textContent = `${user.username || "Tester"} – ${user.email || "Keine E-Mail"}`;
    
        const actions = document.createElement("div");
        actions.style.cssText = "display:flex;gap:8px;";
    
        const approveButton = document.createElement("button");
        approveButton.type = "button";
        approveButton.textContent = "Freischalten";
        approveButton.addEventListener("click", () =>
          updateTester(user.id, "approve")
        );
    
        const rejectButton = document.createElement("button");
        rejectButton.type = "button";
        rejectButton.textContent = "Ablehnen";
        rejectButton.addEventListener("click", () =>
          updateTester(user.id, "reject")
        );
    
        actions.append(approveButton, rejectButton);
        item.append(info, actions);
        pendingUsersList.append(item);
      });
    }
    
    async function updateTester(userId, action) {
      const actionText = action === "approve" ? "freischalten" : "ablehnen";
    
      if (!confirm(`Möchtest du diesen Tester wirklich ${actionText}?`)) {
        return;
      }
    
      pendingUsersMessage.textContent = "Änderung wird gespeichert …";
    
      const { data, error } = await supabaseClient.functions.invoke(
        "beta-admin-users",
        { body: { action, userId } }
      );
    
      if (error || data?.error) {
        console.error("Tester-Verwaltung fehlgeschlagen:", error || data);
        pendingUsersMessage.textContent =
          "Die Änderung ist fehlgeschlagen. Bitte prüfe die Browser-Konsole.";
        return;
      }
    
      pendingUsersMessage.textContent =
        action === "approve"
          ? "Tester wurde freigeschaltet."
          : "Tester wurde abgelehnt.";
    
      await loadPendingUsers();
    }

    
    async function loadApprovedUsers() {
      approvedUsersMessage.textContent = "Lade aktive Tester …";
      approvedUsersList.replaceChildren();
    
      const { data, error } = await supabaseClient.functions.invoke(
        "beta-admin-users",
        { body: { action: "list_approved" } }
      );
    
      if (error || data?.error) {
        console.error("Fehler beim Laden aktiver Tester:", error || data);
        approvedUsersMessage.textContent =
          "Die aktiven Tester konnten nicht geladen werden.";
        return;
      }
    
      const users = data?.users || [];
    
      if (users.length === 0) {
        approvedUsersMessage.textContent =
          "Es gibt noch keine freigeschalteten Tester.";
        return;
      }
    
      approvedUsersMessage.textContent =
        `${users.length} aktive Tester gefunden.`;
    
      users.forEach((user) => {
        const item = document.createElement("div");
        item.style.cssText =
          "display:flex;gap:12px;align-items:center;justify-content:space-between;" +
          "flex-wrap:wrap;padding:12px;margin:10px 0;" +
          "border:1px solid #303340;border-radius:8px;";
    
        const info = document.createElement("div");
        info.textContent =
          `${user.username || "Tester"} – ${user.email || "Keine E-Mail"}`;
    
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Account löschen";
        deleteButton.style.background = "#b83232";
    
        deleteButton.addEventListener("click", () =>
          deleteTester(user.id, user.username || user.email || "Tester")
        );
    
        item.append(info, deleteButton);
        approvedUsersList.append(item);
      });
    }
    
    async function deleteTester(userId, username) {
      const confirmed = confirm(
        `Möchtest du den Account von "${username}" wirklich dauerhaft löschen?\n\n` +
        "Der Tester verliert dadurch seinen Zugang zum Beta-Portal."
      );
    
      if (!confirmed) return;
    
      approvedUsersMessage.textContent = "Account wird gelöscht …";
    
      const { data, error } = await supabaseClient.functions.invoke(
        "beta-admin-users",
        { body: { action: "delete", userId } }
      );
    
      if (error || data?.error || data?.success !== true) {
        console.error("Account-Löschung fehlgeschlagen:", error || data);
        approvedUsersMessage.textContent =
          data?.error || "Der Account konnte nicht gelöscht werden.";
        return;
      }
    
      approvedUsersMessage.textContent = "Account erfolgreich gelöscht.";
    
      await loadApprovedUsers();
    }
    
        
    async function testPendingUsers() {
      await loadPendingUsers();
    }
    
    window.testPendingUsers = testPendingUsers;

  refreshUsersButton.addEventListener("click", loadPendingUsers);

  refreshApprovedButton.addEventListener("click", loadApprovedUsers);
    
  setMode("login");
  </script>

</body>
</html>
